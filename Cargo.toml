# Stitchcraft: a Scratch-style block editor whose canvas exports a Minecraft
# mod for Fabric and NeoForge.
#
# blockstitch is pulled straight from GitHub (pinned to the same master commit as Blockwork) rather than copied
# into this repository; Cargo.lock pins the exact commit. Both crates live in that
# one repository, so Cargo finds each by name.

[workspace]
resolver = "3"
members = ["crates/blocks", "crates/export", "crates/devtools", "crates/app"]
# A bare `cargo run`/`cargo build` means the editor. Use `cargo test --workspace` to
# test everything.
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
blockstitch-core = { git = "https://github.com/Blockworked/blockstitch", rev = "23f26f682f729094710ed4e29efb6ac13980841f" }
blockstitch-qml = { git = "https://github.com/Blockworked/blockstitch", rev = "23f26f682f729094710ed4e29efb6ac13980841f" }
stitchcraft-blocks = { path = "crates/blocks" }
stitchcraft-export = { path = "crates/export" }
stitchcraft-devtools = { path = "crates/devtools" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
